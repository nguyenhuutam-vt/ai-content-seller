name: AI Code Review

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint and build
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.js', 'app/**/*.jsx', 'app/**/*.ts', 'app/**/*.tsx', 'components/**/*.js', 'components/**/*.jsx', 'components/**/*.ts', 'components/**/*.tsx', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build

  codex_review:
    name: Codex PR review
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
    env:
      OPENAI_API_KEY_SET: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Pre-fetch pull request refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head"

      - name: Skip Codex review when API key is missing
        if: ${{ env.OPENAI_API_KEY_SET != 'true' }}
        run: |
          echo "Codex review skipped because OPENAI_API_KEY is not configured in repository Actions secrets." >> "$GITHUB_STEP_SUMMARY"

      - name: Run Codex review
        id: run_codex
        if: ${{ env.OPENAI_API_KEY_SET == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.4-mini
          effort: low
          sandbox: read-only
          prompt: |
            You are reviewing PR #${{ github.event.pull_request.number }} for ${{ github.repository }}.

            Review only the changes introduced by this PR. Use these commands for context:
            - git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - git diff --stat ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
            - git diff --unified=80 --no-ext-diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Project context:
            - This is AI Content Seller, a Vietnamese AI content generator for Shopee and TikTok Shop sellers.
            - Keep the MVP focused on captions, hashtags, product descriptions, and CTAs.
            - Prefer simple TypeScript, low AI/API cost, and existing Next.js/Tailwind patterns.

            Prioritize actionable issues:
            - bugs, broken user flows, security/privacy risks, and production regressions
            - incorrect Next.js, React, TypeScript, or accessibility behavior
            - unnecessary AI/API calls, overly long prompts, or cost risks
            - missing tests or manual checks for risky changes

            Do not spend time on style-only nitpicks that ESLint or formatting should catch.
            Write feedback in Vietnamese. If there are no meaningful issues, say that clearly and mention any residual risk.

            Pull request title:
            ${{ github.event.pull_request.title }}

            Pull request body:
            ${{ github.event.pull_request.body }}

  post_feedback:
    name: Post review comment
    runs-on: ubuntu-latest
    needs: codex_review
    if: ${{ needs.codex_review.outputs.final_message != '' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Upsert Codex review comment
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex_review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- codex-ai-review -->";
            const body = `${marker}\n## Codex AI review\n\n${process.env.CODEX_FINAL_MESSAGE}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });

            const previousComment = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (previousComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
